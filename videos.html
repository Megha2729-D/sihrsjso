    <!-- MOBILE NAVIGATION -->
    <script>
        const menuButton = document.querySelector(".menu-toggle");
        const nav = document.querySelector(".nav");

        menuButton?.addEventListener("click", function () {
            const expanded =
                menuButton.getAttribute("aria-expanded") === "true";

            menuButton.setAttribute(
                "aria-expanded",
                String(!expanded)
            );

            nav?.classList.toggle("open", !expanded);
        });

        nav?.querySelectorAll("a").forEach(function (link) {
            link.addEventListener("click", function () {
                nav.classList.remove("open");

                menuButton?.setAttribute(
                    "aria-expanded",
                    "false"
                );
            });
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const videoCards = Array.from(
                document.querySelectorAll(".video-gallery-item")
            );

            const lightbox = document.getElementById("videoLightbox");
            const player = document.getElementById("lightboxVideo");
            const counter = document.getElementById("videoCounter");

            if (!lightbox || !player || videoCards.length === 0) return;

            const closeButton = lightbox.querySelector(".video-lightbox-close");
            const prevButton = lightbox.querySelector(".video-lightbox-prev");
            const nextButton = lightbox.querySelector(".video-lightbox-next");

            let currentIndex = 0;
            let previousFocus = null;

            function playVideo(index) {
                currentIndex = (index + videoCards.length) % videoCards.length;

                const videoPath = videoCards[currentIndex].dataset.video;

                player.pause();
                player.src = videoPath;
                player.load();

                counter.textContent =
                    `Video ${currentIndex + 1} of ${videoCards.length}`;

                lightbox.hidden = false;
                document.body.style.overflow = "hidden";

                player.play().catch(function () {
                    // Playback can be started manually using the video controls.
                });
            }

            videoCards.forEach(function (card, index) {
                card.addEventListener("click", function () {
                    previousFocus = card;
                    playVideo(index);
                });
            });

            function closeLightbox() {
                player.pause();
                player.removeAttribute("src");
                player.load();

                lightbox.hidden = true;
                document.body.style.overflow = "";

                if (previousFocus) previousFocus.focus();
            }

            closeButton.addEventListener("click", closeLightbox);

            prevButton.addEventListener("click", function () {
                playVideo(currentIndex - 1);
            });

            nextButton.addEventListener("click", function () {
                playVideo(currentIndex + 1);
            });

            lightbox.addEventListener("click", function (event) {
                if (event.target === lightbox) closeLightbox();
            });

            document.addEventListener("keydown", function (event) {
                if (lightbox.hidden) return;

                if (event.key === "Escape") closeLightbox();
                if (event.key === "ArrowLeft") playVideo(currentIndex - 1);
                if (event.key === "ArrowRight") playVideo(currentIndex + 1);
            });
        });
    </script>
