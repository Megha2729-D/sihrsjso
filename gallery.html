    <script>
        const menuButton = document.querySelector('.menu-toggle');
        const nav = document.querySelector('.nav');
        menuButton?.addEventListener('click', () => {
            const expanded = menuButton.getAttribute('aria-expanded') === 'true';
            menuButton.setAttribute('aria-expanded', String(!expanded));
            nav?.classList.toggle('open', !expanded);
        });
        nav?.querySelectorAll('a').forEach((link) => {
            link.addEventListener('click', () => {
                nav.classList.remove('open');
                menuButton?.setAttribute('aria-expanded', 'false');
            });
        });

    </script>

    <script>
        document.querySelectorAll(".service-swiper").forEach((slider) => {
            new Swiper(slider, {
                loop: true,
                loopAdditionalSlides: 4,
                loopPreventsSliding: false,
                speed: 500,
                spaceBetween: 12,
                slidesPerView: 4,

                navigation: {
                    nextEl: slider.querySelector(".swiper-button-next"),
                    prevEl: slider.querySelector(".swiper-button-prev")
                },

                breakpoints: {
                    0: {
                        slidesPerView: 2,
                        spaceBetween: 8
                    },
                    480: {
                        slidesPerView: 3,
                        spaceBetween: 10
                    },
                    768: {
                        slidesPerView: 4,
                        spaceBetween: 12
                    }
                }
            });
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const lightbox = document.getElementById("galleryLightbox");
            if (!lightbox) return;

            const currentCount = document.getElementById("lightboxCurrent");
            const totalCount = document.getElementById("lightboxTotal");
            const closeButton = lightbox.querySelector(".lightbox-close");
            const wrapper = lightbox.querySelector(".swiper-wrapper");
            const photoItems = document.querySelectorAll(".gallery-item");

            let previousFocus = null;

            // Build slider using every gallery image
            wrapper.innerHTML = "";

            photoItems.forEach(function (item, index) {
                const img = item.querySelector("img");
                if (!img) return;

                const slide = document.createElement("div");
                slide.className = "swiper-slide";

                const slideImage = document.createElement("img");
                slideImage.src = img.src;
                slideImage.alt = img.alt || `SIHRSJSO activity ${index + 1}`;

                slide.appendChild(slideImage);
                wrapper.appendChild(slide);
            });

            const totalImages = wrapper.querySelectorAll(".swiper-slide").length;
            totalCount.textContent = totalImages;

            // Initialize slider
            const lightboxSwiper = new Swiper(".lightbox-swiper", {
                loop: true,
                speed: 350,
                slidesPerView: 1,
                spaceBetween: 20,

                navigation: {
                    nextEl: ".lightbox-next",
                    prevEl: ".lightbox-prev"
                },

                keyboard: {
                    enabled: true,
                    onlyInViewport: false
                },

                on: {
                    init: function () {
                        updateCounter(this);
                    },
                    slideChange: function () {
                        updateCounter(this);
                    }
                }
            });

            function updateCounter(swiper) {
                currentCount.textContent = swiper.realIndex + 1;
            }

            // Open the slider at the exact image clicked
            photoItems.forEach(function (item, index) {
                item.addEventListener("click", function () {
                    previousFocus = item;

                    lightbox.hidden = false;
                    lightbox.setAttribute("aria-hidden", "false");
                    document.body.classList.add("lightbox-open");

                    // Start from the clicked image
                    lightboxSwiper.slideToLoop(index, 0);
                    updateCounter(lightboxSwiper);

                    closeButton.focus();
                });
            });

            function closeLightbox() {
                if (lightbox.hidden) return;

                lightbox.hidden = true;
                lightbox.setAttribute("aria-hidden", "true");
                document.body.classList.remove("lightbox-open");

                if (previousFocus) {
                    previousFocus.focus();
                }
            }

            closeButton.addEventListener("click", closeLightbox);

            lightbox.addEventListener("click", function (event) {
                if (event.target === lightbox) {
                    closeLightbox();
                }
            });

            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape" && !lightbox.hidden) {
                    closeLightbox();
                }
            });
        });
    </script>

</body>

</html>
